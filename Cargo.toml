[package]
name = "rise-cli"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Interactive scaffolder for new Rust projects: pick a stack, get a working project on disk"
license = "Apache-2.0"
repository = "https://github.com/EryyynIT/rise"
readme = "README.MD"
keywords = ["cli", "scaffolding", "template", "project-generator", "boilerplate"]
categories = ["command-line-utilities", "development-tools"]

# The package is `rise-cli` (the name `rise` was taken on crates.io), but both
# the library and the binary keep the short name `rise`.
[lib]
name = "rise"

[[bin]]
name = "rise"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
clap_complete = "4"
colored = "3.0.0"
include_dir = "0.7.4"
inquire = "0.7.5"
minijinja = { version = "3.0.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
strum = { version = "0.27.1", features = ["strum_macros"] }
strum_macros = "0.27.1"
thiserror = "2"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1.46", features = ["filters"] }
predicates = "3"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
