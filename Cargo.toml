[package]
name = "rise"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
colored = "3.0.0"
inquire = "0.7.5"
serde = { version = "1.0.219", features = ["derive"] }
strum = { version = "0.27.1", features = ["strum_macros"] }
strum_macros = "0.27.1"
thiserror = "2"
