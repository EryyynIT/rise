[package]
name = "rise-cli"
version = "0.1.0"
edition = "2024"

# The package is `rise-cli` (the name `rise` was taken on crates.io), but both
# the library and the binary keep the short name `rise`.
[lib]
name = "rise"

[[bin]]
name = "rise"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
colored = "3.0.0"
include_dir = "0.7.4"
inquire = "0.7.5"
minijinja = { version = "3.0.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
strum = { version = "0.27.1", features = ["strum_macros"] }
strum_macros = "0.27.1"
thiserror = "2"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
