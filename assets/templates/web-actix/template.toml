name = "web-actix"
description = "Actix Web backend, optionally with a server-side template engine"

# File conditionality lives here, not in Rust code. Keys are OUTPUT paths
# (`.j2` already stripped); when the expression — evaluated against the
# render context — is true, the file is skipped.
[files.exclude_if]
# A WASM-fullstack workspace ships its own Dockerfile and .gitignore
# at the root.
Dockerfile = "backend.deployment != 'docker' or workspace"
".dockerignore" = "backend.deployment != 'docker' or workspace"
# docker compose runs the app together with its Postgres service; embedded
# databases need no second service, non-docker deployments no compose file.
"compose.yaml" = "backend.deployment != 'docker' or workspace or backend.database in ['sled', 'sqlite']"
".gitignore" = "workspace"
# The workspace root ships the project README; members don't repeat it.
"README.md" = "workspace"
# Handlebars uses its own .hbs file; askama/tera/minijinja share index.html;
# every other frontend (or none) ships neither.
"templates/index.html" = "frontend not in ['askama', 'tera', 'minijinja']"
"templates/index.hbs" = "frontend != 'handlebars'"
# The gRPC service definition, its build script and the service module only
# exist with the feature.
"build.rs" = "'grpc' not in backend.features"
"proto/hello.proto" = "'grpc' not in backend.features"
"src/grpc.rs" = "'grpc' not in backend.features"
# The JWT auth module only exists with the feature.
"src/auth.rs" = "'auth' not in backend.features"
