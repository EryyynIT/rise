name = "web-axum"
description = "Backend on Axum + tokio"

# File conditionality lives here, not in Rust code. Keys are OUTPUT paths
# (`.j2` already stripped); when the expression — evaluated against the
# render context — is true, the file is skipped.
[files.exclude_if]
Dockerfile = "spec.WebApp.Backend.deployment != 'docker'"
"src/db.rs" = "spec.WebApp.Backend.database != 'sqlx'"
".env.example" = "spec.WebApp.Backend.database != 'sqlx'"
