name = "web-leptos-axum"
description = "Leptos fullstack app (SSR + hydration) on Axum, built with cargo-leptos"

# File conditionality lives here, not in Rust code. Keys are OUTPUT paths
# (`.j2` already stripped); when the expression — evaluated against the
# render context — is true, the file is skipped.
[files.exclude_if]
Dockerfile = "deployment != 'docker'"
".dockerignore" = "deployment != 'docker'"
# docker compose runs the app together with its Postgres service; embedded
# databases need no second service, non-docker deployments no compose file.
"compose.yaml" = "deployment != 'docker' or backend.database in ['sled', 'sqlite']"
# The gRPC service definition, its build script and the service module only
# exist with the feature.
"build.rs" = "'grpc' not in backend.features"
"proto/hello.proto" = "'grpc' not in backend.features"
"src/grpc.rs" = "'grpc' not in backend.features"
# The JWT auth module only exists with the feature.
"src/auth.rs" = "'auth' not in backend.features"
