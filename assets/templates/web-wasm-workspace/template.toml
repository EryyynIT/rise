name = "web-wasm-workspace"
description = "Workspace root wiring a backend crate and a WASM frontend crate together"
# Building block of fullstack WASM plans, not a user-selectable stack.
internal = true

[files.exclude_if]
Dockerfile = "backend.deployment != 'docker'"
".dockerignore" = "backend.deployment != 'docker'"
# docker compose runs the app together with its Postgres service; embedded
# databases need no second service.
"compose.yaml" = "backend.deployment != 'docker' or backend.database in ['sled', 'sqlite']"
